services:
  db:
    image: postgres:16-alpine
    container_name: autosnab_postgres
    environment:
      POSTGRES_DB: autosnab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autosnab_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  emulator:
    build: .
    container_name: autosnab_emulator
    command: ["uvicorn", "emulator.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      EMULATOR_MIN_DELAY_SECONDS: 0
      EMULATOR_MAX_DELAY_SECONDS: 60
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ping')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: autosnab_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/autosnab_db
      EXTERNAL_SERVER_URL: http://emulator:8001/result
      EXTERNAL_TIMEOUT_SECONDS: 65
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      emulator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
