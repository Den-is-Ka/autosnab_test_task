services:
  db:
    image: postgres:16-alpine
    container_name: autosnab_postgres
    environment:
      POSTGRES_DB: autosnab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autosnab_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: autosnab_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/autosnab_db
      EXTERNAL_SERVER_URL: http://127.0.0.1:8000/result
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
